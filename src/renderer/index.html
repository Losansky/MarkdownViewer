<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkDown Viewer</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar" aria-label="Folder explorer">
        <div id="sidebar-header">
          <div id="sidebar-header-row">
            <span id="sidebar-title">Explorer</span>
            <button
              id="tree-expand-toggle"
              type="button"
              hidden
              title="Expand all"
              aria-label="Expand all"
            >
              +
            </button>
          </div>
          <span id="sidebar-root" title=""></span>
        </div>
        <div id="tree" role="tree" aria-label="Markdown files"></div>
        <div id="sidebar-empty"></div>
      </aside>
      <div
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <div id="workspace">
        <div id="tab-bar" role="tablist" aria-label="Open files"></div>
        <div id="error-banner" hidden></div>
        <div id="document-row">
          <main id="main">
            <div id="doc-view">
              <aside id="line-gutter" aria-hidden="true" aria-label="Line numbers"></aside>
              <article id="preview"></article>
            </div>
            <div id="welcome" hidden></div>
          </main>
          <aside id="toc" hidden aria-label="Table of contents">
            <div id="toc-header">Contents</div>
            <nav id="toc-list"></nav>
          </aside>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
