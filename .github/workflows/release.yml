name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Security checks
        run: npm run test:security

      - name: Tree checks
        run: npm run test:tree

      - name: Unit checks
        run: npm run test:unit

      - name: Build Windows installer
        run: npm run dist

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $minBytes = 40MB
          $copied = @()
          Get-ChildItem release -File -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'uninstaller' } |
            ForEach-Object {
              if ($_.Length -lt $minBytes) {
                throw "Stub or truncated artifact: $($_.Name) is $($_.Length) bytes"
              }
              Copy-Item $_.FullName -Destination artifacts
              $copied += $_.Name
              Write-Host "$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB"
            }
          $hasSetup = $copied | Where-Object { $_ -match 'Setup' }
          $hasPortable = $copied | Where-Object { $_ -notmatch 'Setup' }
          if (-not $hasSetup -or -not $hasPortable) {
            throw "Incomplete Windows build. Found: $($copied -join ', ')"
          }

      - name: Release title
        id: title
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v.StartsWith('v')) { $v = $v.Substring(1) }
          "name=MarkDown Viewer $v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: artifacts/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
