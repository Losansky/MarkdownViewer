name: Bug report
description: Report a problem with MarkDown Viewer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please include enough detail to reproduce the issue.
  - type: input
    id: version
    attributes:
      label: App version
      description: Help → About, or the installer version (for example 1.1.3).
      placeholder: 1.1.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open File → Open Folder…
        2. Open samples/demo.md
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots, sample Markdown, or relevant presentation.json snippets.
